<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md overflow-x-hidden">
<!-- Top Navigation for Login Page -->
<header class="w-full bg-surface shadow-sm z-50">
<div class="flex justify-between items-center w-full px-md py-sm max-w-container-max mx-auto">
<a class="text-h3 font-h1 font-black text-primary tracking-tight" href="#">NesRent</a>
<a class="flex items-center gap-xs text-secondary font-label-md text-label-md hover:text-primary-container transition-colors duration-200" href="#">
<span class="material-symbols-outlined text-body-md">arrow_back</span>
                Back to home
            </a>
</div>
</header>
<!-- Main Content Area: Split Screen -->
<main class="flex-grow flex flex-col lg:flex-row w-full max-w-container-max mx-auto">
<!-- Left Side: Illustration & Tagline -->
<div class="w-full lg:w-1/2 bg-gradient-to-br from-primary-fixed to-primary-container hidden lg:flex flex-col justify-center items-center p-xl relative overflow-hidden">
<div class="relative z-10 text-center flex flex-col items-center">
<img alt="Students with rental items" class="max-w-[400px] w-full object-contain mb-lg rounded-[24px] shadow-sm mix-blend-multiply" data-alt="A modern, highly detailed digital illustration of college students happily sharing and carrying rental equipment like a DSLR camera, a sleek laptop, and a tripod. The scene is vibrant and energetic, set against a clean, minimalist background with a warm yellow glow. The style is playful yet professional, emphasizing community and accessibility in a bright, modern light-mode setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5lF_tzTBuWamleuesHAMl1ebaho2Sowxek4uh-1TDevCDIgSOn7CGw9yWzvdf9RP_2JFAlq7xhxznxkZ6cZppEgtghZE_a_GfFiyMp06GkJHiU_KZeksIbLdONCDnzQz2GCO6RqYtsPXL_7V-1H5HrWtwFIi1TuTmrjad71dliF_GRJhRowhL95mNBG3vBk376PLrgWRVRU3K3IxJ24hiL1rN_GuEEYHHJWRUTBBc6RsixBks-xKdZ2_6jPoWB_ktCe0yEYyn-gxx"/>
<h1 class="font-h1 text-h1 text-on-primary-container mt-lg max-w-[400px]">
                    Sewa barang jadi lebih mudah
                </h1>
</div>
<!-- Decorative background elements -->
<div class="absolute top-[-10%] right-[-10%] w-[300px] h-[300px] bg-white opacity-20 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-primary opacity-20 rounded-full blur-[100px]"></div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex justify-center items-center p-md md:p-xl bg-surface-bright">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-[24px] p-md md:p-lg shadow-[0_4px_20px_rgba(31,41,55,0.04)] border border-outline-variant/30">
<!-- Form Header -->
<div class="mb-lg text-center lg:text-left">
<h2 class="font-h2 text-h2 text-on-surface mb-xs">Login ke NesRent</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Masuk untuk mulai menyewa barang</p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-md">
<!-- Email / NIM Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email_nim">Email / NIM</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full pl-lg pr-sm py-sm rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all font-body-md text-body-md text-on-surface outline-none" id="email_nim" name="email_nim" placeholder="Masukkan Email atau NIM Anda" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-lg pr-sm py-sm rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all font-body-md text-body-md text-on-surface outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Form Utilities -->
<div class="flex justify-between items-center mt-xs">
<label class="flex items-center gap-xs cursor-pointer">
<input class="rounded text-primary-container focus:ring-primary-container/50 border-outline-variant bg-surface w-4 h-4 cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full py-sm rounded-lg bg-primary-container text-on-background font-label-md text-label-md font-bold hover:shadow-[0_8px_24px_rgba(31,41,55,0.1)] hover:-translate-y-[1px] transition-all duration-200" type="submit">
                        Login
                    </button>
</form>
<!-- Footer Text -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Belum punya akun? 
                        <a class="font-label-md text-label-md text-primary hover:underline hover:text-primary-container transition-colors" href="#">Daftar sekarang</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full bg-surface-container-lowest border-t border-outline-variant py-lg px-md flex flex-col md:flex-row justify-between items-center gap-base max-w-container-max mx-auto mt-auto">
<span class="text-label-md font-h1 font-bold text-on-surface">NesRent</span>
<span class="font-caption text-caption text-on-surface-variant">© 2024 NesRent. Built for students.</span>
<div class="flex gap-md font-caption text-caption">
<a class="text-on-surface-variant hover:text-primary transition-all" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-all" href="#">Terms of Service</a>
</div>
</footer>
